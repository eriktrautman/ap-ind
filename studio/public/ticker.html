<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticker</title>
<style>
  /* 1920x1080 lower third. Transparent by default; ?bg=green|black for keying. */
  :root {
    --band: #0e1420; --band-edge: #1c2b47; --fg: #f4f6fa; --muted: #9aa7bd;
    --ind: #a855f7; --call: #facc15;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font); }
  body.bg-green { background: #00ff00; }
  body.bg-black { background: #000; }
  .ticker {
    position: absolute; left: 0; right: 0; bottom: 60px; height: 72px; display: flex; align-items: stretch;
    background: linear-gradient(90deg, var(--band), var(--band-edge));
    color: var(--fg); font-size: 34px; line-height: 72px; font-variant-numeric: tabular-nums;
  }
  .brand { flex: none; padding: 0 28px; background: var(--ind); color: #fff; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 22px; display: flex; align-items: center; gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; }
  .dot.stale { background: #f59e0b; } .dot.dead { background: #ef4444; }
  .crawl { flex: 1; position: relative; overflow: hidden; }
  .track { position: absolute; top: 0; left: 0; white-space: nowrap; will-change: transform; }
  /* Every item carries its own separator, so an item's width never changes when the one before it
     is dropped off the left edge (a width change there would make the crawl jump). */
  .item { display: inline-block; padding: 0; }
  .item::before { content: "◆"; color: var(--muted); font-size: 16px; margin: 0 48px; vertical-align: middle; }   /* the same 48px on both sides: the diamond sits midway between items */
  .item.lead::before { visibility: hidden; }   /* the first item of a fresh crawl: no separator ahead of it, same width */
  .item.emphasis { color: var(--call); font-weight: 700; }
  .item.manual { color: #fff; font-weight: 600; }
  .item.idle { color: var(--muted); }
  .test { position: absolute; right: 0; top: 0; height: 72px; padding: 0 18px; background: #f59e0b; color: #1a1200; font-size: 16px; font-weight: 700; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="ticker">
  <div class="brand"><span class="dot" id="dot"></span>Independents</div>
  <div class="crawl"><div class="track" id="track"></div><div class="test" id="test" hidden>TEST DATA</div></div>
</div>
<script type="module">
  import { buildQueue } from "/ticker-queue.js";
  import { watchState, DEFAULTS } from "/g/control.js";

  const params = new URLSearchParams(location.search);
  // Background: the address wins (?bg=black|green|transparent); otherwise the published one arrives with the state.
  const setBg = (bg) => { document.body.classList.remove("bg-black", "bg-green"); if (bg === "black" || bg === "green") document.body.classList.add(`bg-${bg}`); };
  const bg = params.get("bg");
  if (params.has("bg")) setBg(bg);
  if (params.get("fit") === "1") {   // Preview from the Studio: scale the 1920x1080 page to the window
    const fit = () => { const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1); document.body.style.transformOrigin = "0 0"; document.body.style.transform = `scale(${k})`; document.documentElement.style.background = getComputedStyle(document.body).backgroundColor; };
    window.addEventListener("resize", fit); fit();
  }
  const preview = params.get("preview") === "1";   // studio preview: producer state arrives by postMessage
  // A ticker built entirely from its address, no pushed state involved:
  //   /ticker?bg=black&opacity=60&seq=NE-SEN|~Polls close at 7|MT-SEN|ID-SEN&calls=1&idle=Welcome
  // seq: the crawl order, entries separated by |: a race (its label NE-SEN, CA-6, or AP id) or ~text. Chunks are already
  // expanded into it. Older addresses carry races=NE-SEN,MT-SEN (in order) and item=... (one after every two races).
  // calls=0 turns the yellow AP Call highlight off. Any of the five present switches this mode on.
  const URL_MODE = ["seq", "races", "item", "idle", "calls"].some((k) => params.has(k));
  const urlState = URL_MODE ? {
    seq: params.has("seq") ? params.get("seq").split("|").map((s) => s.trim()).filter(Boolean).map((s, i) => s.startsWith("~") ? { t: "text", id: `url${i}`, text: s.slice(1).trim() } : { t: "race", key: s }) : null,
    pinnedKeys: (params.get("races") ?? "").split(",").map((s) => s.trim()).filter(Boolean),
    callHighlight: params.get("calls") !== "0",
    manualItems: params.getAll("item").map((text, i) => ({ id: `url${i}`, text: text.trim() })).filter((m) => m.text),
    idleText: params.get("idle") || DEFAULTS.idleText,
  } : null;
  // Producer state source: ?src=default|global|local, else the selector saved by the Studio in this
  // browser, else Global. The deployed /ticker has no parameter, so it always reads production.
  const PX_PER_SEC = Number(params.get("speed") ?? 170);
  const INDEX_MS = 15_000, PRODUCER_MS = 5_000, STATUS_MS = 30_000;

  const track = document.getElementById("track");
  const dot = document.getElementById("dot");
  const crawlWidth = () => track.parentElement.clientWidth;

  // A continuous crawl. The track holds only the items on or near the screen: items that have
  // scrolled fully off the left are dropped (the transform is adjusted by their width, so nothing
  // visible moves) and the next item of the queue is appended whenever the track's right edge
  // comes within the crawl's width. A new queue therefore takes effect at the next item boundary:
  // what is on screen finishes crawling, then the new items follow. No loop restart, no jump.
  let queue = [];
  let next = 0;                     // index into queue of the next item to append
  let x = 0;                        // translateX of the track
  let lastT = performance.now();
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function itemEl(it) {
    const el = document.createElement("span");
    el.className = `item ${it.kind} ${it.emphasis ? "emphasis" : ""}`;
    el.textContent = it.text;
    return el;
  }
  function fill() {
    const W = crawlWidth();
    let guard = 0;
    while (queue.length && x + track.offsetWidth < W + 64 && guard++ < 200) {
      const el = itemEl(queue[next % queue.length]);
      if (!track.children.length) el.classList.add("lead");
      track.appendChild(el);
      next = (next + 1) % queue.length;
    }
  }
  function trim() {
    while (track.children.length > 1) {
      const first = track.children[0], second = track.children[1];
      const w = second.offsetLeft - first.offsetLeft;
      if (x + w > 0) break;         // the first item is still (partly) on screen
      first.remove(); x += w;
    }
  }
  function frame(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
    x -= PX_PER_SEC * dt;
    trim(); fill();
    track.style.transform = `translateX(${x}px)`;
    requestAnimationFrame(frame);
  }
  function setQueue(items) {
    const same = queue.length === items.length && queue.every((q, i) => q.key === items[i].key && q.text === items[i].text);
    if (same) return;
    // Before any data, or while only the idle line is crawling, there is nothing worth finishing:
    // start the new list at once. Otherwise what is on screen finishes and the new list follows.
    const restart = !queue.length || queue.every((q) => q.kind === "idle");
    queue = items; next = 0;
    if (restart) { track.innerHTML = ""; x = crawlWidth(); }
    // otherwise the items already on the track finish crawling; the new queue starts at the next append
  }
  function setItems(items) { setQueue(items); }

  // Data. Every fetch is best-effort: on failure the last good copy keeps crawling.
  let races = [];
  let producer = null;
  let status = null;
  let lastGood = 0;

  function rebuild() {
    if (URL_MODE) {   // resolve the address's race keys against the feed: a label or an AP id
      const byLabel = new Map(races.map((r) => [r.label, r.id])), byId = new Set(races.map((r) => r.id));
      const resolve = (k) => (byId.has(k) ? k : byLabel.get(k.toUpperCase()));
      producer = urlState.seq
        ? { ...urlState, tickerItems: urlState.seq.map((it) => it.t === "race" ? { t: "race", id: resolve(it.key) ?? it.key } : it), chunks: [] }
        : { ...urlState, pinnedRaceIds: urlState.pinnedKeys.map(resolve).filter(Boolean) };
    }
    const q = buildQueue(races, producer);
    setQueue(q.items);
    window.parent?.postMessage({ type: "ticker-queue", source: q.source, missing: q.missing, count: q.items.length }, "*");
  }
  async function getJSON(url) {
    const res = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    return res.json();
  }
  async function loadIndex() {
    try {
      const d = await getJSON(`/data/index.json?t=${Math.floor(Date.now() / INDEX_MS)}`);
      if (Array.isArray(d.races)) { races = d.races; lastGood = Date.now(); rebuild(); }
      document.getElementById("test").hidden = d.resultsType !== "t";
    } catch {}
  }
  if (URL_MODE) window.parent?.postMessage({ type: "ticker-source", source: "url", requested: "url", error: null }, "*");
  else watchState({
    intervalMs: PRODUCER_MS, preview,
    onState: (state, info) => {
      producer = state; rebuild();
      if (!params.has("bg")) setBg(state.tickerBg);
      window.parent?.postMessage({ type: "ticker-source", source: info.source, requested: info.requested, error: info.error }, "*");
    },
  });
  async function loadStatus() {
    try { status = await getJSON(`/data/status.json?t=${Math.floor(Date.now() / STATUS_MS)}`); } catch {}
    const age = status?.lastApSuccess ? (Date.now() - Date.parse(status.lastApSuccess)) / 1000 : Infinity;
    dot.className = `dot ${age < 180 ? "" : age < 600 ? "stale" : "dead"}`;
  }

  rebuild();                      // idle crawl is on screen before any data arrives
  x = crawlWidth();
  loadIndex(); loadStatus();
  setInterval(loadIndex, INDEX_MS);
  setInterval(loadStatus, STATUS_MS);
  requestAnimationFrame(frame);
</script>
</body>
</html>
