<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticker</title>
<style>
  /* 1920x1080 lower third. Transparent by default; ?bg=green|black for keying. */
  :root {
    --band: #0e1420; --band-edge: #1c2b47; --fg: #f4f6fa; --muted: #9aa7bd;
    --ind: #a855f7; --call: #facc15;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font); }
  body.bg-green { background: #00ff00; }
  body.bg-black { background: #000; }
  .ticker {
    position: absolute; left: 0; right: 0; bottom: 60px; height: 72px; display: flex; align-items: stretch;
    background: linear-gradient(90deg, var(--band), var(--band-edge));
    color: var(--fg); font-size: 34px; line-height: 72px; font-variant-numeric: tabular-nums;
  }
  .brand { flex: none; padding: 0 28px; background: var(--ind); color: #fff; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 22px; display: flex; align-items: center; gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; }
  .dot.stale { background: #f59e0b; } .dot.dead { background: #ef4444; }
  .crawl { flex: 1; position: relative; overflow: hidden; }
  .track { position: absolute; top: 0; left: 0; white-space: nowrap; will-change: transform; }
  .item { display: inline-block; padding: 0 48px; }
  .item + .item::before { content: "◆"; color: var(--muted); font-size: 16px; margin-right: 48px; vertical-align: middle; }
  .item.emphasis { color: var(--call); font-weight: 700; }
  .item.manual { color: #fff; font-weight: 600; }
  .item.idle { color: var(--muted); }
  .test { position: absolute; right: 0; top: 0; height: 72px; padding: 0 18px; background: #f59e0b; color: #1a1200; font-size: 16px; font-weight: 700; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="ticker">
  <div class="brand"><span class="dot" id="dot"></span>Independents</div>
  <div class="crawl"><div class="track" id="track"></div><div class="test" id="test" hidden>TEST DATA</div></div>
</div>
<script type="module">
  import { buildQueue } from "/ticker-queue.js";
  import { watchState } from "/g/control.js";

  const params = new URLSearchParams(location.search);
  const bg = params.get("bg");
  if (bg) document.body.classList.add(`bg-${bg}`);
  const preview = params.get("preview") === "1";   // studio preview: producer state arrives by postMessage
  // Producer state source: ?src=default|global|local, else the selector saved by /studio in this
  // browser, else Global. Air runs /ticker with no parameter, so it is always on Global.
  const PX_PER_SEC = Number(params.get("speed") ?? 170);
  const INDEX_MS = 15_000, PRODUCER_MS = 5_000, STATUS_MS = 30_000;

  const track = document.getElementById("track");
  const dot = document.getElementById("dot");
  const crawlWidth = () => track.parentElement.clientWidth;

  // A continuous crawl. The track holds only the items on or near the screen: items that have
  // scrolled fully off the left are dropped (the transform is adjusted by their width, so nothing
  // visible moves) and the next item of the queue is appended whenever the track's right edge
  // comes within the crawl's width. A new queue therefore takes effect at the next item boundary:
  // what is on screen finishes crawling, then the new items follow. No loop restart, no jump.
  let queue = [];
  let next = 0;                     // index into queue of the next item to append
  let x = 0;                        // translateX of the track
  let lastT = performance.now();
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function itemEl(it) {
    const el = document.createElement("span");
    el.className = `item ${it.kind} ${it.emphasis ? "emphasis" : ""}`;
    el.textContent = it.text;
    return el;
  }
  function fill() {
    const W = crawlWidth();
    let guard = 0;
    while (queue.length && x + track.offsetWidth < W + 64 && guard++ < 200) {
      track.appendChild(itemEl(queue[next % queue.length]));
      next = (next + 1) % queue.length;
    }
  }
  function trim() {
    while (track.children.length > 1) {
      const first = track.children[0], second = track.children[1];
      const w = second.offsetLeft - first.offsetLeft;
      if (x + w > 0) break;         // the first item is still (partly) on screen
      first.remove(); x += w;
    }
  }
  function frame(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
    x -= PX_PER_SEC * dt;
    trim(); fill();
    track.style.transform = `translateX(${x}px)`;
    requestAnimationFrame(frame);
  }
  function setQueue(items) {
    const same = queue.length === items.length && queue.every((q, i) => q.key === items[i].key && q.text === items[i].text);
    if (same) return;
    const wasEmpty = !queue.length;
    queue = items; next = 0;
    if (wasEmpty) { track.innerHTML = ""; x = crawlWidth(); }
    // otherwise the items already on the track finish crawling; the new queue starts at the next append
  }
  function setItems(items) { setQueue(items); }

  // Data. Every fetch is best-effort: on failure the last good copy stays on air.
  let races = [];
  let producer = null;
  let status = null;
  let lastGood = 0;

  function rebuild() {
    const q = buildQueue(races, producer);
    setQueue(q.items);
    window.parent?.postMessage({ type: "ticker-queue", source: q.source, missing: q.missing, count: q.items.length }, "*");
  }
  async function getJSON(url) {
    const res = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    return res.json();
  }
  async function loadIndex() {
    try {
      const d = await getJSON(`/data/index.json?t=${Math.floor(Date.now() / INDEX_MS)}`);
      if (Array.isArray(d.races)) { races = d.races; lastGood = Date.now(); rebuild(); }
      document.getElementById("test").hidden = d.resultsType !== "t";
    } catch {}
  }
  const control = watchState({
    intervalMs: PRODUCER_MS, preview,
    onState: (state, info) => {
      producer = state; rebuild();
      window.parent?.postMessage({ type: "ticker-source", source: info.source, requested: info.requested, error: info.error }, "*");
    },
  });
  async function loadStatus() {
    try { status = await getJSON(`/data/status.json?t=${Math.floor(Date.now() / STATUS_MS)}`); } catch {}
    const age = status?.lastApSuccess ? (Date.now() - Date.parse(status.lastApSuccess)) / 1000 : Infinity;
    dot.className = `dot ${age < 180 ? "" : age < 600 ? "stale" : "dead"}`;
  }

  rebuild();                      // idle crawl is on screen before any data arrives
  x = crawlWidth();
  loadIndex(); loadStatus();
  setInterval(loadIndex, INDEX_MS);
  setInterval(loadStatus, STATUS_MS);
  requestAnimationFrame(frame);
</script>
</body>
</html>
