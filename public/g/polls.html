<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poll vs Result</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* C7: the independent's final poll against their result, one dot per featured race. Polls from config/polls.json. */
  .body { display: grid; grid-template-columns: 1fr 560px; gap: 48px; min-height: 0; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .axis text { fill: var(--muted); font-size: 22px; font-family: var(--font); }
  .axis line, .axis path { stroke: var(--rule); }
  .lbl { font-size: 26px; font-weight: 700; fill: #fff; font-family: var(--font); }
  .lbl.dim { fill: var(--muted); font-weight: 400; }
  table { font-size: 24px; } th { font-size: 20px; } td { padding: 7px 6px; }
  td.lab { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .src { font-size: 18px; color: var(--muted); margin-top: 10px; line-height: 1.3; }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Poll vs result · featured races</div><div class="title">Did the independents beat their polls?</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body">
    <div class="chart"><svg id="chart" viewBox="0 0 1060 560"></svg></div>
    <div><table><thead><tr><th>Race</th><th>Independent</th><th class="r">Poll</th><th class="r">Result</th><th class="r">Diff</th></tr></thead><tbody id="rows"></tbody></table><div class="src" id="src"></div></div>
  </div>
  <div class="foot"><span><span class="dot" id="dot"></span>Dots above the line = running ahead of the final poll · hollow = still counting · poll = newest public poll per race, campaign-sponsored polls flagged</span><span id="updated"></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module">
  import { connectFeed, freshness, isFeaturedCand, clockS } from "./feed.js";
  import { watchState, FEATURED_RACES } from "./control.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let races = null, polls = null, ids = FEATURED_RACES.map((r) => r.id);

  function finalPoll(raceId) {
    const list = polls?.races?.[raceId]?.polls ?? [];
    if (!list.length) return null;
    return list.find((p) => p.final) ?? [...list].filter((p) => !p.average).sort((a, b) => String(b.dates).localeCompare(String(a.dates)))[0] ?? list[0];
  }
  function render() {
    if (!races) return;
    const rows = [];
    for (const id of ids) {
      const r = races.get(id); if (!r) continue;
      const ind = r.candidates.find((c) => c.featured) ?? r.candidates.find((c) => isFeaturedCand(c.id)) ?? r.candidates.find((c) => c.independent);
      if (!ind) continue;
      const p = finalPoll(id);
      const poll = p ? (p.numbers[ind.last] ?? Object.entries(p.numbers).find(([k]) => ind.name.includes(k))?.[1] ?? null) : null;
      rows.push({ r, ind, p, poll, result: r.totalVotes ? ind.pct : null, done: r.called || (r.eevp || r.precinctsPct) >= 95 });
    }
    $("reporting").innerHTML = `<b>${rows.filter((x) => x.poll !== null).length}</b> of ${rows.length} races have a public poll`;
    $("rows").innerHTML = rows.map(({ r, ind, p, poll, result }) => `<tr><td class="lab">${esc(r.label)}</td><td>${esc(ind.last)}</td><td class="r">${poll === null ? "<span class='m'>no poll</span>" : `${poll}%${p.sponsored ? "<span title='campaign-sponsored'>*</span>" : ""}`}</td><td class="r b">${result === null ? "—" : result.toFixed(1) + "%"}</td><td class="r b ${poll !== null && result !== null ? (result - poll >= 0 ? "pos" : "neg") : ""}">${poll !== null && result !== null ? (result - poll >= 0 ? "+" : "") + (result - poll).toFixed(1) : "—"}</td></tr>`).join("");
    $("src").innerHTML = rows.filter((x) => x.p).map(({ r, p }) => `${esc(r.label)}: ${esc(p.pollster)}${p.sponsored ? " (campaign-sponsored)" : p.partisan ? ` (${p.partisan})` : ""}, ${esc(p.dates)}`).join(" · ") + (rows.some((x) => x.p?.sponsored) ? " · * campaign-sponsored" : "");
    // scatter: x = poll, y = result
    const svg = d3.select("#chart"); svg.selectAll("*").remove();
    const W = 1060, H = 560, m = { l: 90, r: 40, t: 30, b: 70 };
    const pts = rows.filter((x) => x.poll !== null && x.result !== null);
    const ext = [0, Math.max(60, ...pts.map((x) => Math.max(x.poll, x.result)) ) + 5];
    const x = d3.scaleLinear().domain(ext).range([m.l, W - m.r]), y = d3.scaleLinear().domain(ext).range([H - m.b, m.t]);
    svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(6).tickFormat((v) => v + "%").tickSize(-(H - m.t - m.b))).call((g) => { g.select(".domain").remove(); g.selectAll("line").attr("stroke", "#2a3a5c"); });
    svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(6).tickFormat((v) => v + "%").tickSize(-(W - m.l - m.r))).call((g) => { g.select(".domain").remove(); g.selectAll("line").attr("stroke", "#2a3a5c"); });
    svg.append("text").attr("class", "lbl dim").attr("x", W - m.r).attr("y", H - 18).attr("text-anchor", "end").text("Final poll →");
    svg.append("text").attr("class", "lbl dim").attr("x", m.l + 8).attr("y", m.t + 24).text("↑ Result tonight");
    svg.append("line").attr("x1", x(ext[0])).attr("y1", y(ext[0])).attr("x2", x(ext[1])).attr("y2", y(ext[1])).attr("stroke", "#9aa7bd").attr("stroke-dasharray", "8 8").attr("stroke-width", 2);
    for (const pt of pts) {
      svg.append("circle").attr("cx", x(pt.poll)).attr("cy", y(pt.result)).attr("r", 12).attr("fill", pt.done ? "#facc15" : "none").attr("stroke", "#facc15").attr("stroke-width", 4);
      svg.append("text").attr("class", "lbl").attr("x", x(pt.poll) + 18).attr("y", y(pt.result) + 9).text(`${pt.ind.last}${pt.done ? "" : " (counting)"}`);
    }
    if (!pts.length) svg.append("text").attr("class", "lbl dim").attr("x", W / 2).attr("y", H / 2).attr("text-anchor", "middle").text("Dots appear as results come in");
    $("updated").textContent = `Updated ${clockS()}`;
  }
  watchState({ onState: (s) => { ids = s.featuredRaceIds.length ? s.featuredRaceIds : FEATURED_RACES.map((r) => r.id); render(); } });
  connectFeed({
    onSnapshot: async (s) => { races = s.races; try { polls = await (await fetch("./polls.json")).json(); } catch { polls = null; } render(); },
    onUpdate: (s) => { races = s.races; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
