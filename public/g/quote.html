<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote Card</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B11: a pull quote with attribution from config/quotes.json (editorial). ?n=<index>; or ?quote=&who=&source= directly. */
  .panel { grid-template-rows: 1fr auto; }
  .q { font-family: Georgia, "Iowan Old Style", serif; font-size: 64px; line-height: 1.25; align-self: center; padding-right: 120px; }
  .q::before { content: "\\201C"; color: var(--gold); font-size: 120px; line-height: 0; vertical-align: -40px; margin-right: 14px; }
  .who { display: flex; justify-content: space-between; align-items: flex-end; }
  .who b { font-size: 40px; } .who .src { color: var(--muted); font-size: 26px; margin-top: 6px; }
  .who .mark { font-family: Georgia, serif; color: var(--gold); font-size: 160px; line-height: 0.5; }
</style>
</head>
<body>
<div class="panel">
  <div class="q" id="q"></div>
  <div class="who"><div><b id="who"></b><div class="src" id="src"></div></div><div class="mark">”</div></div>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const show = (x) => { $("q").textContent = x.quote; $("who").textContent = x.who; $("src").textContent = x.source ?? ""; };
  if (q.get("quote")) show({ quote: q.get("quote"), who: q.get("who") ?? "", source: q.get("source") ?? "" });
  else fetch("./quotes.json").then((r) => r.json()).then((d) => {
    const list = d.quotes ?? []; if (!list.length) { show({ quote: "No quotes in config/quotes.json yet.", who: "", source: "" }); return; }
    let i = Number(q.get("n") ?? 0) % list.length; show(list[i]);
    if (!q.has("n") && list.length > 1) setInterval(() => { i = (i + 1) % list.length; show(list[i]); }, 15000);
  }).catch(() => show({ quote: "Quotes file missing.", who: "", source: "" }));
</script>
</body>
</html>
