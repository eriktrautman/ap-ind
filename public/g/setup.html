<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Setup</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B2: the race before results: who is running, who holds the seat, the last result, the latest poll, when polls close. ?id=<raceID> */
  .body { display: grid; grid-template-columns: 1fr 560px; gap: 56px; min-height: 0; }
  .cands { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .cand { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 18px; align-items: center; background: rgba(0,0,0,.25); border-radius: 8px; padding: 14px 20px; min-width: 0; }
  .cand > div { min-width: 0; }
  .cand .pic { width: 72px; height: 72px; border-radius: 50%; background: #1b2a4a center/cover; }
  .cand .nm { font-size: 34px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cand .nm small { font-size: 22px; color: var(--muted); font-weight: 400; margin-left: 12px; }
  .cand .sub { font-size: 22px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand .pc { font-size: 34px; font-weight: 700; color: var(--muted); }
  .side { display: grid; gap: 18px; align-content: start; min-width: 0; }
  .box .v { overflow-wrap: anywhere; }
  .box { background: rgba(0,0,0,.25); border-radius: 8px; padding: 16px 22px; }
  .box .k { font-size: 20px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .box .v { font-size: 30px; line-height: 1.25; } .box .v b { color: var(--gold); }
  .box .m { font-size: 20px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Race setup</div><div class="title" id="title">Loading…</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body"><div class="cands" id="cands"></div><div class="side" id="side"></div></div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: AP (candidates, incumbency, poll close), AP results for the last contest, public polls (config/polls.json)</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, partyKey, PARTY_COLOR, officeText, isFeaturedCand } from "./feed.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const raceId = q.get("id");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let race = null, prior = null, polls = null, bios = null;
  async function loadStatic() {
    try { prior = (await (await fetch("./baseline-federal.json")).json()).races?.[raceId] ?? null; } catch {}
    try { polls = (await (await fetch("./polls.json")).json()).races?.[raceId]?.polls ?? null; } catch {}
    try { bios = new Map((await (await fetch("./candidates.json")).json()).candidates.map((c) => [c.id, c])); } catch { bios = new Map(); }
  }
  function render() {
    if (!race) { $("title").textContent = "Race not found"; return; }
    const cands = [...race.candidates].sort((a, b) => (b.featured || isFeaturedCand(b.id)) - (a.featured || isFeaturedCand(a.id)) || b.votes - a.votes).slice(0, 4);
    $("title").innerHTML = `${esc(race.stateName)} <small>${esc(officeText(race))}</small>`;
    $("reporting").innerHTML = race.totalVotes ? `<b>${Math.round(race.eevp || race.precinctsPct)}%</b> of expected vote in` : race.pollClose ? `Polls close ${new Date(race.pollClose).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" })}` : "";
    $("cands").innerHTML = cands.map((c) => {
      const b = bios?.get(c.id) ?? {};
      const lab = b.partyLabel ?? (partyKey(c) === "ind" ? "Independent" : c.party === "Dem" ? "Democrat" : c.party === "GOP" ? "Republican" : c.party);
      return `<div class="cand"><div class="pic" style="${c.photo ? `background-image:url('${c.photo}')` : ""}"></div><div><div class="nm" style="color:${PARTY_COLOR[partyKey(c)]}">${esc(c.name)}<small>${esc(lab)}${c.incumbent ? " · incumbent" : ""}</small></div><div class="sub">${esc(b.occupation ?? b.priorOffices ?? "")}</div></div><div class="pc">${race.totalVotes ? Number(c.pct).toFixed(1) + "%" : ""}</div></div>`;
    }).join("");
    const holder = race.currentParty ? `${race.currentParty === "Dem" ? "Democratic" : race.currentParty === "GOP" ? "Republican" : race.currentParty}-held seat` : "Open seat";
    const inc = race.candidates.find((c) => c.incumbent);
    const last = prior ? `<div class="v">${prior.candidates.slice(0, 2).map((c) => `<span style="color:${PARTY_COLOR[partyKey(c)]}">${esc(c.last)}</span> ${c.pct}%`).join(" · ")}</div><div class="m">${prior.date.slice(0, 4)} · ${esc(prior.raceType ?? "")}${prior.note ? " · " + esc(prior.note) : ""}</div>` : `<div class="v m">No prior result on file.</div>`;
    const p = polls?.filter((x) => !x.average).sort((a, b) => String(b.dates).localeCompare(String(a.dates)))[0];
    const poll = p ? `<div class="v">${Object.entries(p.numbers).map(([k, v]) => `${esc(k)} <b>${v}</b>`).join(" · ")}</div><div class="m">${esc(p.pollster)}${p.sponsored ? " (campaign-sponsored)" : p.partisan ? ` (${p.partisan})` : ""} · ${esc(p.dates)}${p.sample ? ` · n=${p.sample}` : ""}</div>` : `<div class="v m">No public poll on file.</div>`;
    $("side").innerHTML = `<div class="box"><div class="k">Seat</div><div class="v">${esc(holder)}${inc ? ` · <span style="color:${PARTY_COLOR[partyKey(inc)]}">${esc(inc.last)}</span> running` : ""}</div>${race.rankedChoice ? `<div class="m">Ranked-choice voting</div>` : ""}</div>
      <div class="box"><div class="k">Last time</div>${last}</div>
      <div class="box"><div class="k">Latest poll</div>${poll}</div>
      ${race.pollClose ? `<div class="box"><div class="k">Polls close</div><div class="v">${new Date(race.pollClose).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" })}</div></div>` : ""}`;
    $("updated").textContent = `Updated ${new Date(race.lastUpdated).toLocaleTimeString("en-US")}`;
  }
  connectFeed({
    onSnapshot: async (s) => { race = s.races.get(raceId); await loadStatic(); render(); },
    onUpdate: (s, msg) => { if (msg.changed.some((r) => r.id === raceId)) { race = s.races.get(raceId); render(); } },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
