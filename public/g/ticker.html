<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticker</title>
<style>
  /* 1920x1080 lower third. Transparent by default; ?bg=green|black for keying. */
  :root {
    --band: #0e1420;
    --band-edge: #1c2b47;
    --fg: #f4f6fa;
    --muted: #9aa7bd;
    --dem: #3b82f6;
    --gop: #ef4444;
    --ind: #a855f7;
    --call: #facc15;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font); }
  body.bg-green { background: #00ff00; }
  body.bg-black { background: #000; }

  .ticker {
    position: absolute; left: 0; right: 0; bottom: 60px; /* inside the 1080 action-safe area */
    height: 72px; display: flex; align-items: stretch;
    background: linear-gradient(90deg, var(--band), var(--band-edge));
    color: var(--fg); font-size: 34px; line-height: 72px;
    font-variant-numeric: tabular-nums;
  }
  .brand {
    flex: none; padding: 0 28px; background: var(--ind); color: #fff;
    font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 22px;
    display: flex; align-items: center; gap: 14px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; }
  .dot.stale { background: #f59e0b; } .dot.dead { background: #ef4444; }
  .crawl { flex: 1; position: relative; overflow: hidden; }
  .track { position: absolute; top: 0; left: 0; white-space: nowrap; will-change: transform; }
  .item { display: inline-block; padding: 0 48px; }
  .item + .item::before { content: "◆"; color: var(--muted); font-size: 16px; margin-right: 48px; vertical-align: middle; }
  .item.emphasis { color: var(--call); font-weight: 700; }
  .item.manual { color: #fff; font-weight: 600; }
  .hold { position: absolute; left: 32px; top: 0; color: var(--muted); }
</style>
</head>
<body>
<div class="ticker">
  <div class="brand"><span class="dot" id="dot"></span>Independents</div>
  <div class="crawl"><div class="track" id="track"></div></div>
</div>
<script type="module">
  import { connectFeed, freshness } from "./feed.js";

  const bg = new URLSearchParams(location.search).get("bg");
  if (bg) document.body.classList.add(`bg-${bg}`);

  const PX_PER_SEC = 170;
  const track = document.getElementById("track");
  const crawlWidth = () => track.parentElement.clientWidth;

  // Two copies of the queue are rendered back to back; when the first scrolls out we
  // swap in the latest queue so updates land at a loop boundary, never mid-crawl.
  let queue = [];
  let pending = null;
  let x = 32; // first item already on screen when the layer is cut to air
  let lastT = performance.now();

  function render(items) {
    track.innerHTML = items.map((it) =>
      `<span class="item ${it.kind} ${it.emphasis ? "emphasis" : ""}">${escape(it.text)}</span>`
    ).join("");
  }
  function escape(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  function frame(t) {
    const dt = (t - lastT) / 1000; lastT = t;
    x -= PX_PER_SEC * dt;
    if (x < -track.offsetWidth) {
      if (pending) { queue = pending; pending = null; render(queue); }
      x = crawlWidth();
    }
    track.style.transform = `translateX(${x}px)`;
    requestAnimationFrame(frame);
  }

  function setQueue(items) {
    if (!queue.length) { queue = items; render(queue); }
    else pending = items; // applied at the next loop boundary
  }

  connectFeed({
    onSnapshot: (s) => setQueue(s.ticker),
    onUpdate: (s) => setQueue(s.ticker),
    onTicker: (s) => setQueue(s.ticker),
    onStatus: (s) => { document.getElementById("dot").className = `dot ${freshness(s.status)}`; },
  });
  requestAnimationFrame(frame);
</script>
</body>
</html>
