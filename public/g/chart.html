<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./g.css">
<style>
  /* Only ever visible when the address cannot be resolved: a plain error card in the panel chrome. */
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body.bg-green { background: #00ff00; } body.bg-black { background: #000; }
  .panel { border: 4px solid var(--bad); display: none; }
  .panel.on { display: grid; }
  .err { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 48px; min-height: 0; overflow: hidden; font-size: 26px; }
  .err h2 { font-size: 24px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; font-weight: 400; }
  .err .box { background: rgba(0,0,0,.3); border-radius: 8px; padding: 18px 22px; min-height: 0; overflow: hidden; }
  .err .wide { grid-column: 1 / -1; }
  .err table { font-size: 26px; } .err td { padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: normal; }
  .err td.k { color: var(--muted); font-family: ui-monospace, Menlo, monospace; width: 220px; }
  .err code { font-family: ui-monospace, Menlo, monospace; background: rgba(255,255,255,.08); padding: 2px 8px; border-radius: 4px; }
  .err .missing { color: var(--bad); font-weight: 700; }
  .err .ok { color: var(--ok); }
  .err ul { margin: 0; padding-left: 28px; } .err li { margin: 6px 0; }
  .err .ids { font-size: 22px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="head"><div><div class="kicker">Chart address error · nothing to show</div><div class="title" id="etitle">Underspecified chart</div></div><div class="reporting"><span class="missing" id="ecount"></span></div></div>
  <div class="err" id="err"></div>
  <div class="foot"><span>This card is shown instead of a graphic so a bad address is never mistaken for data. Fix the address and reload.</span><span id="ehost"></span></div>
</div>
<script type="module">
  // Semantic address for every graphic:  /g/<chartID>?bg=black&opacity=60&race=NE-SEN
  // (also /g/chart?chart=B5&race=NE-SEN). Resolves the chart id through the registry and the race
  // label through the live index, then draws the page in a full-size frame (the address stays /g/B5?...). Display
  // parameters (bg, opacity, fit, src, ...) stay first in the address; everything else is passed
  // through to the page unchanged. An address that does not fully specify its chart (unknown chart,
  // a race chart with no race, a race the feed does not have, a state chart with no state) never
  // shows a graphic: this page stays and prints what it received, what the chart needs and what
  // is missing, so the problem is obvious on the monitor and nothing wrong goes to air.
  import { CHARTS, FEATURED_RACES } from "./control.js";

  const q = new URLSearchParams(location.search);
  const DISPLAY = ["bg", "opacity", "fit", "src", "preview", "sample", "demo", "speed"];   // the order they appear in
  const CONSUMED = new Set(["chart", "race", "id", "state", "st", "cand", "a", "b"]);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const problems = [];   // {what, detail}

  // 1. the chart: ?chart=B5, else the path (/g/B5)
  const want = (q.get("chart") ?? (location.pathname.match(/\/g\/([A-Za-z]\d{1,2})\/?$/) ?? [])[1] ?? "").toUpperCase();
  const known = CHARTS.find((c) => c.id === want);
  const chart = known && known.built && !known.retired && known.page ? known : null;
  if (!want) problems.push({ what: "chart id", detail: "no chart id in the address: use /g/<chart id>?… or ?chart=<chart id>" });
  else if (!known) problems.push({ what: "chart id", detail: `${want} is not a chart id` });
  else if (known.retired) problems.push({ what: "chart id", detail: `${want} (${known.name}) is retired${known.retiredNote ? ": " + known.retiredNote : ""}` });
  else if (!known.built || !known.page) problems.push({ what: "chart id", detail: `${want} (${known.name}) is not built${known.unavailable ? ": " + known.unavailable : ""}` });
  const raceBased = !!chart && (chart.kind === "race" || chart.needsRace);
  const stateBased = !!chart && !!chart.needsState;

  // 2. the race: a label (NE-SEN, CA-6, AK-GOV) or an AP race id; a state for state charts
  const raceKey = (q.get("race") ?? q.get("id") ?? "").trim();
  const stateKey = (q.get("state") ?? q.get("st") ?? "").trim().toUpperCase();
  let index = null, indexFailed = false;
  async function loadIndex() {
    if (index || q.get("demo")) return index;
    for (let i = 0; i < 2 && !index; i++) {
      try { index = (await (await fetch("/data/index.json", { cache: "no-store", signal: AbortSignal.timeout(6000) })).json()).races ?? null; } catch { index = null; }
    }
    indexFailed = !index;
    return index;
  }
  function featuredByKey(k) { const K = k.toUpperCase(); return FEATURED_RACES.find((r) => r.id === k || r.label === K) ?? null; }
  async function resolveRace(k) {
    if (!k) return null;
    const f = featuredByKey(k); if (f) return { id: f.id, state: f.state, label: f.label };
    const list = await loadIndex();
    const r = list?.find((x) => x.label === k.toUpperCase() || x.id === k);
    return r ? { id: r.id, state: r.state, label: r.label } : null;
  }
  async function resolveCand(race, k) {
    if (!k || /^\d{1,12}$/.test(k) || !race) return k || null;                  // an AP candidate id or nothing
    const list = await loadIndex();
    const r = list?.find((x) => x.id === race.id);
    const c = r?.candidates.find((x) => (x.last ?? "").toLowerCase() === k.toLowerCase()) ?? r?.candidates.find((x) => x.name.toLowerCase().includes(k.toLowerCase()));
    if (!c) problems.push({ what: "candidate", detail: `no candidate "${k}" in ${race.label ?? race.id}${r ? ` (there: ${r.candidates.map((x) => x.last).join(", ")})` : ""}` });
    return c?.id ?? null;
  }

  const race = await resolveRace(raceKey);
  if (raceKey && !race) problems.push({ what: "race id", detail: indexFailed ? `could not check "${raceKey}" against the feed (index.json unreachable); reload` : `"${raceKey}" is not a race in the feed: race ids look like NE-SEN, CA-6, AK-GOV, AK-MEASURE-3 (an AP race id also works)` });
  if (raceBased && !raceKey) problems.push({ what: "race id", detail: `${chart.id} ${chart.name} draws one race: add race=<race id>, e.g. race=${FEATURED_RACES[0].label}` });
  const state = stateKey || race?.state || "";
  if (stateBased && !state) problems.push({ what: "state", detail: `${chart.id} ${chart.name} draws one state: add state=<two letters>, e.g. state=${FEATURED_RACES[0].state}, or a race in that state` });
  else if (stateBased && !/^[A-Z]{2}$/.test(state)) problems.push({ what: "state", detail: `"${stateKey}" is not a two-letter state code` });
  const cands = {};
  if (chart && race) for (const k of ["cand", "a", "b"]) if (q.has(k)) cands[k] = await resolveCand(race, q.get(k));

  if (!problems.length) {
    // 3. the page address: display parameters first, then what identifies the data, then the rest.
    // The page is drawn in a full-size frame, so /g/B5?... stays the address on screen and in the switcher.
    const dest = new URL(chart.page, location.origin);
    const out = new URLSearchParams();
    for (const k of DISPLAY) if (q.has(k) && k !== "fit") out.set(k, q.get(k));   // fit is applied here, to the frame
    for (const [k, v] of dest.searchParams) out.set(k, v);                        // e.g. reports.html?view=counts
    if (race) out.set("id", race.id);
    if (stateBased) out.set("st", state);
    for (const [k, v] of Object.entries(cands)) if (v) out.set(k, v);
    for (const [k, v] of q) if (!DISPLAY.includes(k) && !CONSUMED.has(k)) out.append(k, v);
    document.title = `${chart.id} ${chart.name}${race?.label ? " · " + race.label : stateBased ? " · " + state : ""}`;
    const f = document.createElement("iframe");
    f.id = "g"; f.title = document.title;
    f.style.cssText = "position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:transparent";
    f.src = `${dest.pathname.replace(/\.html$/, "")}?${out.toString()}`;
    document.body.appendChild(f);
    // Messages pass through: the Studio's feed/producer posts go down to the page, the page's reports go up.
    window.addEventListener("message", (e) => { if (e.source === f.contentWindow) window.parent?.postMessage(e.data, "*"); else f.contentWindow?.postMessage(e.data, "*"); });
    if (q.get("fit") === "1") {   // Preview from the Studio: the 1920x1080 frame scaled to the window
      const fit = () => { const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1); document.body.style.transformOrigin = "0 0"; document.body.style.transform = `scale(${k})`; document.documentElement.style.overflow = "hidden"; };
      window.addEventListener("resize", fit); fit();
    }
  } else {
    // The error card: what came in, what this chart needs, what is wrong, and a corrected example.
    const received = [["path", location.pathname], ...[...q.entries()]];
    const needs = !chart ? ["a chart id from the list below"] : [
      ...(raceBased ? ["race=<race id>  (NE-SEN, CA-6, AK-GOV, …; an AP race id also works)"] : []),
      ...(stateBased ? ["state=<two-letter state>  (or a race in that state)"] : []),
      ...(chart.id === "B1" || chart.id === "A2" ? ["cand=<last name or AP id>  optional; default: the featured candidate"] : []),
      ...(chart.id === "B14" ? ["a=&b=<last name or AP id>  optional; default: the two leaders"] : []),
      ...(chart.id === "B13" ? ["who=ind|main  optional"] : []),
      ...(raceBased || stateBased ? [] : ["nothing beyond the chart id"]),
      "display, optional and first: bg=black|green, opacity=10..100, src=global|local|default",
    ];
    const ex = chart ? `/g/${chart.id}?bg=black${raceBased ? `&race=${race?.label ?? FEATURED_RACES[0].label}` : stateBased ? `&state=${/^[A-Z]{2}$/.test(state) ? state : FEATURED_RACES[0].state}` : ""}` : `/g/B5?bg=black&race=${FEATURED_RACES[0].label}`;
    const bySeries = {}; for (const c of CHARTS) if (c.built && !c.retired && c.page) (bySeries[c.id[0]] ??= []).push(c.id);
    $("etitle").textContent = chart ? `${chart.id} ${chart.name}: not enough to draw it` : want ? `${want}: not a chart` : "No chart id";
    $("ecount").textContent = `${problems.length} problem${problems.length === 1 ? "" : "s"}`;
    $("ehost").textContent = location.host;
    $("err").innerHTML = `
      <div class="box"><h2>Received</h2><table>${received.map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(v) || "<i>(empty)</i>"}</td></tr>`).join("")}</table></div>
      <div class="box"><h2>${chart ? `${esc(chart.id)} needs` : "A chart needs"}</h2><ul>${needs.map((n) => `<li><code>${esc(n)}</code></li>`).join("")}</ul></div>
      <div class="box wide"><h2>Missing or wrong</h2><ul>${problems.map((p) => `<li><span class="missing">${esc(p.what)}</span>: ${esc(p.detail)}</li>`).join("")}</ul>
        <p>Example that works: <code class="ok">${esc(ex)}</code></p>
        ${!chart ? `<p class="ids">Chart ids: ${Object.entries(bySeries).map(([s, ids]) => `<b>${s}</b> ${ids.join(" ")}`).join(" · ")}</p>` : ""}</div>`;
    $("panel").classList.add("on");
    console.warn(`[chart] ${problems.map((p) => `${p.what}: ${p.detail}`).join("; ")}`);
  }
</script>
</body>
</html>
