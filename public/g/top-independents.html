<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tonight Against History</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* C5: the best independent results on record (config/independents-results.json) with tonight's featured independents live among them. */
  .body { min-height: 0; overflow: hidden; }
  .rows { display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 420px 1fr 130px; align-items: center; gap: 18px; font-size: 30px; }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .row .nm small { color: var(--muted); font-size: 22px; margin-left: 10px; }
  .row .bar { height: 34px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; } .row .bar i { display: block; height: 100%; border-radius: 4px; background: var(--ind); }
  .row .pc { text-align: right; font-weight: 700; }
  .row.tonight .nm { color: #fde68a; font-weight: 700; } .row.tonight .bar i { background: var(--gold); } .row.tonight .pc { color: var(--gold); }
  .row.tonight.counting .bar i { opacity: .55; }
  .row.won .nm::after { content: " ✓"; color: var(--ok); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">The independent movement</div><div class="title">Tonight against history</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body"><div class="rows" id="rows"></div></div>
  <div class="foot"><span><span class="dot" id="dot"></span>Independent share of the vote in federal races · historical rows from the record (config/independents-results.json) · gold rows are tonight, faded while counting</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, isFeaturedCand } from "./feed.js";
  import { watchState, FEATURED_RACES } from "./control.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let races = null, hist = null, featured = FEATURED_RACES.map((r) => r.id);
  function render() {
    if (!hist) return;
    const rows = hist.map((h) => ({ ...h, tonight: false }));
    for (const id of featured) {
      const r = races?.get(id); if (!r || !r.totalVotes) continue;
      const ind = r.candidates.find((c) => c.featured) ?? r.candidates.find((c) => isFeaturedCand(c.id)) ?? r.candidates.find((c) => c.independent); if (!ind) continue;
      rows.push({ name: ind.name, race: r.label, year: "tonight", share: ind.pct, won: !!ind.winner, counting: !r.called, tonight: true, note: `${Math.round(r.eevp || r.precinctsPct)}% in` });
    }
    rows.sort((a, b) => b.share - a.share);
    const max = Math.max(1, ...rows.map((r) => r.share));
    $("rows").innerHTML = rows.slice(0, 11).map((r) => `<div class="row ${r.tonight ? "tonight" : ""} ${r.counting ? "counting" : ""} ${r.won ? "won" : ""}"><div class="nm">${esc(r.name)}<small>${esc(r.race)} ${esc(String(r.year))}${r.note ? " · " + esc(r.note) : ""}</small></div><div class="bar"><i style="width:${r.share / max * 100}%"></i></div><div class="pc">${Number(r.share).toFixed(1)}%</div></div>`).join("");
    $("reporting").innerHTML = `<b>${rows.filter((r) => r.tonight).length}</b> of ${featured.length} tonight with results`;
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString("en-US")}`;
  }
  watchState({ onState: (s) => { featured = s.featuredRaceIds.length ? s.featuredRaceIds : FEATURED_RACES.map((r) => r.id); render(); } });
  connectFeed({
    onSnapshot: async (s) => { races = s.races; try { hist = (await (await fetch("./independents-results.json")).json()).rows; } catch { hist = []; } render(); },
    onUpdate: (s) => { races = s.races; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
