<!doctype html>
<html lang="en">
<head>
<script src="/g/theme-boot.js"></script>
<meta charset="utf-8">
<title>National Independent Vote</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* C6: votes for candidates outside the two major parties across every federal race, against 2022, the last midterm. ?office=S|H|all */
  .body { display: grid; grid-template-columns: 1fr 560px; gap: 60px; align-items: center; min-height: 0; }
  .big { font-size: 150px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .sub { font-size: 32px; color: var(--muted); margin-top: 10px; }
  .cmp { font-size: 40px; margin-top: 34px; } .cmp b { color: var(--gold); font-size: 56px; } .cmp .m { color: var(--muted); font-size: 32px; }
  .ring text { font-family: var(--font); font-weight: 700; fill: #fff; }
  .legend { font-size: 24px; color: var(--muted); margin-top: 12px; display: flex; justify-content: center; gap: 24px; }
  .legend i { display: inline-block; width: 20px; height: 20px; border-radius: 3px; vertical-align: -2px; margin-right: 8px; }
  .legend i.lap { height: 6px; vertical-align: 5px; }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Independent vote tonight</div><div class="title" id="title">All federal races</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body">
    <div><div class="big" id="big">—</div><div class="sub" id="sub">votes for independent and third-party candidates so far</div><div class="cmp" id="cmp"></div></div>
    <div><svg class="ring" id="ring" viewBox="0 0 400 400"></svg><div class="legend" id="legend"></div></div>
  </div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: AP via lightship.media · Ind = not Dem or Rep</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, clockS } from "./feed.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const office = q.get("office") ?? "all";
  const $ = (id) => document.getElementById(id);
  const compact = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}K` : String(n);
  let races = null, base = null;

  function render() {
    if (!races) return;
    const list = [...races.values()].filter((r) => r.kind === "federal" && (office === "all" || r.office === office));
    let ind = 0, total = 0, reporting = 0, withInd = 0;
    for (const r of list) {
      if (r.totalVotes > 0) reporting++;
      if (r.hasIndependent) withInd++;
      for (const c of r.candidates) { total += c.votes; if (c.party !== "Dem" && c.party !== "GOP") ind += c.votes; }
    }
    const share = total ? ind / total * 100 : null;
    const nat = base?.national?.["2022"];
    const bPrior = nat ? (office === "all" ? { other: nat.S.other + nat.H.other, total: nat.S.total + nat.H.total } : nat[office]) : null;
    const sharePrior = bPrior ? bPrior.other / bPrior.total * 100 : null;
    $("title").textContent = office === "S" ? "U.S. Senate" : office === "H" ? "U.S. House" : "All federal races";
    $("reporting").innerHTML = `<b>${reporting}</b> of ${list.length} races reporting`;
    $("big").textContent = total ? compact(ind) : "—";
    $("sub").textContent = `votes for independent and third-party candidates so far · ${withInd} of ${list.length} races have one on the ballot`;
    $("cmp").innerHTML = share === null ? "" : `<b>${share.toFixed(1)}%</b> of all votes counted ${sharePrior !== null ? `<span class="m">· 2022: ${sharePrior.toFixed(1)}%</span>` : ""}`;
    const svg = d3.select("#ring"); svg.selectAll("*").remove();
    // One full lap of the ring is 2022's share. Chasing it, the fat gold arc fills the gray track. Past it, the finished lap
    // becomes a thin gold circle in the middle of the band and the fat arc starts again from the top with whatever is beyond.
    const GOLD = "var(--gold)", TRACK = "#3a4560";
    const band = (from, to, fill, inner = 128, outer = 172) => svg.append("path").attr("transform", "translate(200,200)").style("fill", fill).attr("d", d3.arc()({ innerRadius: inner, outerRadius: outer, startAngle: from * 2 * Math.PI, endAngle: to * 2 * Math.PI }));
    const center = (y, size, text, fill) => { const t = svg.append("text").attr("x", 200).attr("y", y).attr("text-anchor", "middle").attr("font-size", size).text(text); if (fill) t.style("fill", fill); return t; };
    const pct = share !== null && sharePrior ? share / sharePrior * 100 : null;   // tonight's share as a percent of 2022's
    const ahead = pct !== null && Math.round(pct) > 100;
    band(0, 1, TRACK);
    if (ahead) {
      band(0, 1, GOLD, 146, 154);
      band(0, Math.min(1, (pct - 100) / 100), GOLD);   // twice 2022 or more: the arc has closed; the number keeps counting
      const plus = `+${Math.round(pct - 100).toLocaleString("en-US")}%`;
      center(222, plus.length > 5 ? 50 : plus.length > 4 ? 66 : 84, plus, GOLD);
      center(258, 24, "ahead of 2022", "var(--muted)").attr("font-weight", 400);
    } else {
      if (pct !== null) band(0, Math.min(1, pct / 100), GOLD);
      center(215, 64, share === null ? "—" : `${share.toFixed(1)}%`);
      if (sharePrior !== null) center(258, 24, pct === null ? `2022: ${sharePrior.toFixed(1)}%` : `${Math.round(pct)}% of 2022`, "var(--muted)").attr("font-weight", 400);
    }
    $("legend").innerHTML = ahead
      ? `<span><i class="lap" style="background:${GOLD}"></i>2022 share</span><span><i style="background:${GOLD}"></i>past 2022</span>`
      : `<span><i style="background:${GOLD}"></i>tonight</span>${sharePrior !== null ? `<span><i style="background:${TRACK}"></i>2022 share</span>` : ""}`;
    $("updated").textContent = `Updated ${clockS()}`;
  }
  const feed = connectFeed({
    onSnapshot: async (s) => { races = s.races; base = await feed.baselineFederal(); render(); },
    onUpdate: (s) => { races = s.races; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</body>
</html>
