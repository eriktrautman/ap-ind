<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polling Trend</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B3: every public poll for the race on a timeline, one line per candidate, from config/polls.json. ?id=<raceID> */
  .body { display: grid; grid-template-columns: 1fr 520px; gap: 48px; min-height: 0; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .axis text { fill: var(--muted); font-size: 22px; font-family: var(--font); }
  .axis line { stroke: #2a3a5c; }
  .ln { fill: none; stroke-width: 4; opacity: .8; }
  .lbl { font-size: 26px; font-weight: 700; font-family: var(--font); }
  table { font-size: 22px; } th { font-size: 18px; } td { padding: 6px 6px; }
  .src { font-size: 18px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Polling trend</div><div class="title" id="title">Loading…</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body">
    <div class="chart"><svg id="chart" viewBox="0 0 1040 560"></svg></div>
    <div><table><thead><tr><th>Poll</th><th>Dates</th><th class="r" id="th-a">A</th><th class="r" id="th-b">B</th></tr></thead><tbody id="rows"></tbody></table><div class="src" id="src"></div></div>
  </div>
  <div class="foot"><span><span class="dot" id="dot"></span>Public polls, newest first · * campaign-sponsored · (D)/(R) partisan pollster · a dot per poll, line through them</span><span id="updated"></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module">
  import { connectFeed, freshness, partyKey, PARTY_COLOR, officeText, isFeaturedCand, clockS } from "./feed.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const raceId = q.get("id");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let race = null, polls = null;
  const endDate = (d) => { const s = String(d); const last = s.includes("/") ? s.split("/")[1] : s; return new Date(last.length === 7 ? last + "-15" : last); };
  function render() {
    if (!race) { $("title").textContent = "Race not found"; return; }
    $("title").innerHTML = `${esc(race.stateName)} <small>${esc(officeText(race))}</small>`;
    const list = (polls ?? []).filter((p) => !p.average).map((p) => ({ ...p, t: endDate(p.dates) })).filter((p) => !isNaN(p.t)).sort((a, b) => a.t - b.t);
    $("reporting").innerHTML = `<b>${list.length}</b> public poll${list.length === 1 ? "" : "s"}`;
    const cands = [...race.candidates].sort((a, b) => (b.featured || isFeaturedCand(b.id)) - (a.featured || isFeaturedCand(a.id)) || b.votes - a.votes).slice(0, 2);
    const key = (c) => Object.keys(list[0]?.numbers ?? {}).find((k) => k === c.last || c.name.includes(k)) ?? c.last;
    const series = cands.map((c) => ({ c, k: key(c), pts: list.map((p) => ({ t: p.t, v: p.numbers[key(c)] ?? null, p })).filter((x) => x.v !== null) }));
    $("th-a").textContent = cands[0]?.last ?? ""; $("th-b").textContent = cands[1]?.last ?? "";
    $("rows").innerHTML = [...list].reverse().slice(0, 9).map((p) => `<tr><td>${esc(p.pollster)}${p.sponsored ? "*" : p.partisan ? ` (${p.partisan})` : ""}</td><td class="m">${esc(p.dates)}</td><td class="r b">${p.numbers[series[0]?.k] ?? "—"}</td><td class="r b">${p.numbers[series[1]?.k] ?? "—"}</td></tr>`).join("") || `<tr><td colspan="4" class="m">No public polls on file for this race.</td></tr>`;
    $("src").textContent = list.length ? "Sources on every row in config/polls.json." : "";
    const svg = d3.select("#chart"); svg.selectAll("*").remove();
    if (!list.length) return;
    const W = 1040, H = 560, m = { l: 70, r: 140, t: 30, b: 50 };
    const x = d3.scaleTime().domain(d3.extent(list, (p) => p.t)).nice().range([m.l, W - m.r]);
    const allV = series.flatMap((s) => s.pts.map((x) => x.v));
    const y = d3.scaleLinear().domain([Math.max(0, d3.min(allV) - 10), Math.min(100, d3.max(allV) + 10)]).nice().range([H - m.b, m.t]);
    svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(5).tickFormat(d3.timeFormat("%b %-d")).tickSize(0)).select(".domain").remove();
    svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat((v) => v + "%").tickSize(-(W - m.l - m.r))).call((g) => g.select(".domain").remove());
    const line = d3.line().x((d) => x(d.t)).y((d) => y(d.v)).curve(d3.curveMonotoneX);
    for (const s of series) {
      const color = PARTY_COLOR[partyKey(s.c)];
      if (s.pts.length > 1) svg.append("path").datum(s.pts).attr("class", "ln").attr("stroke", color).attr("d", line);
      for (const p of s.pts) svg.append("circle").attr("cx", x(p.t)).attr("cy", y(p.v)).attr("r", p.p.sponsored ? 7 : 9).attr("fill", p.p.sponsored ? "none" : color).attr("stroke", color).attr("stroke-width", 3);
      const last = s.pts[s.pts.length - 1];
      if (last) svg.append("text").attr("class", "lbl").attr("x", x(last.t) + 16).attr("y", y(last.v) + 9).attr("fill", color).text(`${s.c.last} ${last.v}`);
    }
    $("updated").textContent = `Updated ${clockS()}`;
  }
  connectFeed({
    onSnapshot: async (s) => { race = s.races.get(raceId); try { polls = (await (await fetch("./polls.json")).json()).races?.[raceId]?.polls ?? []; } catch { polls = []; } render(); },
    onUpdate: (s, msg) => { if (msg.changed.some((r) => r.id === raceId)) { race = s.races.get(raceId); render(); } },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
