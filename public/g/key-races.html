<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key Races</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* D5: eight race cards. The producer's key races list (keyRaceIds) or, when empty, the ticker races. */
  .body { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 20px; min-height: 0; }
  .kc { background: rgba(0,0,0,.25); border-radius: 8px; padding: 18px 22px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; border-left: 6px solid #2a3a5c; }
  .kc.featured { border-left-color: var(--gold); }
  .kc .lab { font-family: ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 700; }
  .kc .lab small { font-family: var(--font); font-size: 20px; color: var(--muted); font-weight: 400; margin-left: 10px; }
  .kc .cands { display: grid; gap: 8px; align-content: start; }
  .kc .c { display: grid; grid-template-columns: 1fr auto; font-size: 28px; gap: 10px; }
  .kc .c .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kc .c.ind .nm { color: #fde68a; font-weight: 600; }
  .kc .c .pc { font-weight: 700; }
  .pill { display: inline-block; font-size: 20px; font-weight: 700; padding: 3px 12px; border-radius: 4px; letter-spacing: .04em; justify-self: start; }
  .pill.call { background: var(--gold); color: #1a1600; } .pill.counting { background: #2a3a5c; color: #fff; } .pill.open { background: #16213a; color: var(--muted); border: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Key races</div><div class="title" id="title">Where it stands</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body" id="grid"></div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: AP · gold edge = featured race · the producer picks these eight in the control room</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, raceState, partyKey, clockS } from "./feed.js";
  import { watchState } from "./control.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let races = null, ids = [], featured = new Set();

  function render() {
    if (!races) return;
    const list = ids.map((id) => races.get(id)).filter(Boolean).slice(0, 8);
    $("reporting").innerHTML = `<b>${list.filter((r) => r.called).length}</b> of ${list.length} called`;
    $("grid").innerHTML = list.map((r) => {
      const st = raceState(r);
      const cands = [...r.candidates].sort((a, b) => b.votes - a.votes).slice(0, 2);
      const pill = st.status === "called" ? `<span class="pill call">AP CALL</span>` : st.status === "leading" ? `<span class="pill counting">${Math.round(r.eevp || r.precinctsPct)}% IN</span>` : st.status === "closed" ? `<span class="pill open">CLOSED</span>` : `<span class="pill open">POLLS OPEN</span>`;
      return `<div class="kc ${featured.has(r.id) ? "featured" : ""}"><div class="lab">${esc(r.label)}<small>${esc(r.stateName)}</small></div><div class="cands">${cands.map((c) => `<div class="c ${partyKey(c)}"><span class="nm">${esc(c.last)}${c.winner ? " ✓" : ""}</span><span class="pc">${r.totalVotes ? Number(c.pct).toFixed(1) : ""}</span></div>`).join("")}</div>${pill}</div>`;
    }).join("") || `<div class="empty" style="grid-column:1/-1">No key races selected.</div>`;
    $("updated").textContent = `Updated ${clockS()}`;
  }
  watchState({ onState: (s) => { ids = s.keyRaceIds.length ? s.keyRaceIds : s.pinnedRaceIds; featured = new Set(s.featuredRaceIds); render(); } });
  connectFeed({
    onSnapshot: (s) => { races = s.races; render(); },
    onUpdate: (s) => { races = s.races; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
