<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Independents in Congress</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* C4: members serving as independents, by Congress, from config/independents-history.json (editorial), with tonight's featured races as the question mark. */
  .body { display: grid; grid-template-rows: 1fr auto; gap: 16px; min-height: 0; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .axis text { fill: var(--muted); font-size: 22px; font-family: var(--font); }
  .lbl { font-size: 22px; fill: #cfd8ea; font-family: var(--font); }
  .lbl.gold { fill: var(--gold); font-weight: 700; }
  .names { font-size: 22px; color: var(--muted); line-height: 1.4; }
  .names b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Independents in Congress</div><div class="title">1971 to tonight</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body"><div class="chart"><svg id="chart" viewBox="0 0 1584 480"></svg></div><div class="names" id="names"></div></div>
  <div class="foot"><span><span class="dot" id="dot"></span>Members serving as independents or under a third-party label, by Congress · editorial table in config/independents-history.json</span><span id="updated"></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module">
  import { connectFeed, freshness } from "./feed.js";
  import { watchState, FEATURED_RACES } from "./control.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let members = null, races = null, featured = FEATURED_RACES.map((r) => r.id);
  function render() {
    if (!members) return;
    // One bar per Congress (two years), counting members whose term covers its first year.
    const years = d3.range(1971, 2027, 2);
    const counts = years.map((y) => ({ y, n: members.filter((m) => m.from <= y && m.to > y).length, who: members.filter((m) => m.from <= y && m.to > y).map((m) => m.name) }));
    const tonight = races ? featured.map((id) => races.get(id)).filter((r) => r?.called && r.candidates.find((c) => c.winner)?.independent).length : 0;
    const possible = featured.length;
    const svg = d3.select("#chart"); svg.selectAll("*").remove();
    const W = 1584, H = 480, m = { l: 60, r: 40, t: 50, b: 50 };
    const x = d3.scaleBand().domain([...years, 2027]).range([m.l, W - m.r]).padding(0.25);
    const y = d3.scaleLinear().domain([0, Math.max(4, d3.max(counts, (c) => c.n) + 1, 2 + possible)]).range([H - m.b, m.t]);
    svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues([1971, 1981, 1991, 2001, 2011, 2021, 2027]).tickFormat((v) => (v === 2027 ? "tonight" : v)).tickSize(0)).select(".domain").remove();
    svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(-(W - m.l - m.r))).call((g) => { g.select(".domain").remove(); g.selectAll("line").attr("stroke", "#2a3a5c"); });
    svg.selectAll("rect.c").data(counts).enter().append("rect").attr("class", "c").attr("x", (d) => x(d.y)).attr("y", (d) => y(d.n)).attr("width", x.bandwidth()).attr("height", (d) => y(0) - y(d.n)).attr("fill", "#d4af37").attr("rx", 3);
    // Tonight: the two sitting independents plus whatever the featured races deliver (solid = won so far, faint = still possible).
    const base = 2;
    svg.append("rect").attr("x", x(2027)).attr("y", y(base + tonight)).attr("width", x.bandwidth()).attr("height", y(0) - y(base + tonight)).attr("fill", "#facc15").attr("rx", 3);
    svg.append("rect").attr("x", x(2027)).attr("y", y(base + possible)).attr("width", x.bandwidth()).attr("height", y(base + tonight) - y(base + possible)).attr("fill", "#facc15").attr("fill-opacity", 0.3).attr("rx", 3);
    svg.append("text").attr("class", "lbl gold").attr("x", x(2027) + x.bandwidth() / 2).attr("y", y(base + possible) - 12).attr("text-anchor", "middle").text(tonight ? `${base + tonight} so far, up to ${base + possible}` : `up to ${base + possible}?`);
    for (const [yr, name] of [[1971, "Byrd Jr., Buckley"], [1991, "Sanders"], [2007, "Lieberman"], [2013, "King"], [2023, "Sinema"]]) { const c = counts.find((k) => k.y === yr); if (c) svg.append("text").attr("class", "lbl").attr("x", x(yr) + x.bandwidth() / 2).attr("y", y(c.n) - 10).attr("text-anchor", "middle").text(name); }
    const current = members.filter((m) => m.to > 2026).map((m) => `<b>${esc(m.name)}</b> (${esc(m.state)}, ${esc(m.chamber)}, since ${m.from})`);
    $("names").innerHTML = `Serving now: ${current.join(" · ")}. Featured independents tonight: ${featured.length}${tonight ? `, of whom <b>${tonight}</b> ${tonight === 1 ? "has" : "have"} won` : ""}.`;
    $("reporting").innerHTML = `<b>${members.length}</b> members since 1971`;
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString("en-US")}`;
  }
  watchState({ onState: (s) => { featured = s.featuredRaceIds.length ? s.featuredRaceIds : FEATURED_RACES.map((r) => r.id); render(); } });
  connectFeed({
    onSnapshot: async (s) => { races = s.races; try { members = (await (await fetch("./independents-history.json")).json()).members; } catch { members = []; } render(); },
    onUpdate: (s) => { races = s.races; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
