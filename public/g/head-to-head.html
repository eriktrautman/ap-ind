<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Head-to-Head</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B14: the two candidates who matter, face to face. Before results: the featured independent and the
     opponent the latest poll puts closest (else the incumbent, else the seat holder's party), with the
     poll, the last result and poll-close time between them. Once votes are counted: the two leaders, with
     live shares, the margin and the AP call. ?id=<raceID>; ?a=<candID>&b=<candID> fixes the pair. */
  .body { display: grid; grid-template-columns: 1fr 380px 1fr; gap: 40px; min-height: 0; }
  .cand { position: relative; display: grid; grid-template-rows: auto auto auto auto 1fr; align-content: start; justify-items: center; text-align: center; background: rgba(0,0,0,.25); border-radius: 10px; padding: 22px 28px 18px; min-width: 0; min-height: 0; overflow: hidden; border-top: 8px solid var(--c, #5c6b85); }
  .cand > * { min-width: 0; max-width: 100%; }
  .photo { width: 260px; height: 312px; border-radius: 8px; background: #1b2a4a center top/cover no-repeat; display: flex; align-items: flex-end; justify-content: center; color: var(--muted); font-size: 22px; }
  .photo.none::after { content: "no verified photo"; padding-bottom: 16px; }
  .nm { font-size: 40px; font-weight: 700; margin-top: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c, var(--fg)); }
  .lab { font-size: 22px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 20px; color: var(--muted); margin-top: 8px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .num { font-size: 56px; font-weight: 700; line-height: 1; align-self: end; color: var(--c, var(--fg)); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num small { font-size: 22px; color: var(--muted); font-weight: 400; margin-left: 12px; }
  .pill { position: absolute; top: 18px; right: 18px; font-size: 20px; font-weight: 700; padding: 4px 12px; border-radius: 4px; letter-spacing: .06em; }
  .pill.call { background: var(--gold); color: #1a1600; } .pill.lead { background: #2a3a5c; color: #fff; }
  .mid { display: grid; align-content: center; gap: 18px; text-align: center; min-width: 0; }
  .vs { font-size: 54px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
  .box { background: rgba(0,0,0,.25); border-radius: 8px; padding: 14px 18px; }
  .box .k { font-size: 19px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .box .v { font-size: 30px; line-height: 1.25; font-variant-numeric: tabular-nums; } .box .v b { font-size: 40px; }
  .box .m { font-size: 19px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .box .v .ahead { color: var(--ok); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker" id="kicker">Head-to-head</div><div class="title" id="title">Loading…</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body"><div class="cand" id="a"></div><div class="mid" id="mid"></div><div class="cand" id="b"></div></div>
  <div class="foot"><span><span class="dot" id="dot"></span><span id="src">Source: AP · bios and photos from config/candidates.json · public polls (config/polls.json)</span></span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, partyKey, PARTY_COLOR, officeText, raceState, isFeaturedCand, fmt } from "./feed.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const raceId = q.get("id"), forceA = q.get("a"), forceB = q.get("b");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const timeText = (iso) => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  let race = null, bios = null, polls = null, prior = null;
  async function loadStatic() {
    try { bios = new Map((await (await fetch("./candidates.json")).json()).candidates.map((c) => [c.id, c])); } catch { bios = new Map(); }
    try { polls = (await (await fetch("./polls.json")).json()).races?.[raceId]?.polls ?? null; } catch {}
    try { prior = (await (await fetch("./baseline-federal.json")).json()).races?.[raceId] ?? null; } catch {}
  }
  const latestPoll = () => polls?.filter((x) => !x.average).sort((a, b) => String(b.dates).localeCompare(String(a.dates)))[0] ?? null;
  /** A poll's number for this candidate: keyed by last name, else by any key the full name contains. */
  function pollNumber(p, c) {
    if (!p) return null;
    if (p.numbers[c.last] != null) return p.numbers[c.last];
    const k = Object.keys(p.numbers).find((n) => c.name.toLowerCase().includes(n.toLowerCase()));
    return k ? p.numbers[k] : null;
  }
  const isFeat = (c) => c.featured || isFeaturedCand(c.id);
  const label = (c, b) => b.partyLabel ?? (partyKey(c) === "ind" ? "Independent" : c.party === "Dem" ? "Democrat" : c.party === "GOP" ? "Republican" : c.party);

  /** The pair: fixed by ?a&b; else the two vote leaders; else the featured candidate and the closest poll rival, the incumbent, or the seat holder's party. */
  function pickPair() {
    const cs = race.candidates;
    if (forceA && forceB) { const a = cs.find((c) => c.id === forceA), b = cs.find((c) => c.id === forceB); if (a && b) return [a, b]; }
    if (race.totalVotes > 0) return [...cs].sort((a, b) => b.votes - a.votes).slice(0, 2);
    const first = cs.find(isFeat) ?? cs.find((c) => c.incumbent) ?? cs[0];
    const others = cs.filter((c) => c.id !== first.id);
    const p = latestPoll();
    const byPoll = p ? [...others].filter((c) => pollNumber(p, c) != null).sort((a, b) => pollNumber(p, b) - pollNumber(p, a))[0] : null;
    const second = byPoll ?? others.find((c) => c.incumbent) ?? others.find((c) => c.party === race.currentParty) ?? others.find((c) => c.party === "GOP" || c.party === "Dem") ?? others[0];
    // The one ahead in the poll stands on the left.
    if (p && pollNumber(p, second) != null && pollNumber(p, first) != null && pollNumber(p, second) > pollNumber(p, first)) return [second, first];
    return [first, second].filter(Boolean);
  }

  function card(c, st, p) {
    if (!c) return `<div class="nm" style="color:var(--muted)">—</div>`;
    const b = bios?.get(c.id) ?? {};
    const col = PARTY_COLOR[partyKey(c)];
    const sub = b.occupation ?? b.priorOffices ?? "";
    const counting = race.totalVotes > 0;
    const pill = st.status === "called" && st.cand?.id === c.id ? `<span class="pill call">AP CALL · WINS</span>` : st.status === "leading" && st.cand?.id === c.id ? `<span class="pill lead">LEADING</span>` : "";
    const num = counting
      ? `<div class="num">${Number(c.pct).toFixed(1)}%<small>${fmt(c.votes)} votes</small></div>`
      : pollNumber(p, c) != null ? `<div class="num">${pollNumber(p, c)}%<small>latest poll</small></div>` : `<div class="num" style="color:var(--muted)">—<small>no poll</small></div>`;
    return `<div class="cand" style="--c:${col}">
      <div class="photo ${c.photo ? "" : "none"}" style="${c.photo ? `background-image:url('${esc(c.photo)}')` : ""}"></div>
      <div class="nm">${esc(c.name)}</div>
      <div class="lab">${esc(label(c, b))}${c.incumbent ? " · incumbent" : ""}</div>
      <div class="sub">${esc(String(sub).slice(0, 110))}</div>
      ${num}${pill}
    </div>`;
  }

  function render() {
    if (!race) { $("title").textContent = "Race not found"; return; }
    const st = raceState(race);
    const p = latestPoll();
    const [a, b] = pickPair();
    $("kicker").textContent = race.totalVotes > 0 ? "Head-to-head · live" : "Head-to-head";
    $("title").innerHTML = `${esc(race.stateName)} <small>${esc(officeText(race))}</small>`;
    $("reporting").innerHTML = race.totalVotes ? `<b>${Math.round(race.eevp || race.precinctsPct)}%</b> of expected vote in` : race.pollClose ? `Polls close ${esc(timeText(race.pollClose))}` : "";
    $("a").outerHTML = card(a, st, p); $("b").outerHTML = card(b, st, p);
    document.querySelectorAll(".body .cand").forEach((el, i) => (el.id = i === 0 ? "a" : "b"));
    const boxes = [];
    if (race.totalVotes > 0 && a && b) {
      const lead = a.votes >= b.votes ? a : b, trail = lead === a ? b : a;
      const margin = Math.abs(Number(a.pct) - Number(b.pct));
      boxes.push(`<div class="box"><div class="k">Margin</div><div class="v"><b style="color:${PARTY_COLOR[partyKey(lead)]}">${esc(lead.last)}</b> +${margin.toFixed(1)}</div><div class="m">${fmt(Math.abs(a.votes - b.votes))} votes ahead of ${esc(trail.last)}</div></div>`);
      const rest = race.candidates.filter((c) => c !== a && c !== b).reduce((s, c) => s + Number(c.pct || 0), 0);
      if (rest > 0) boxes.push(`<div class="box"><div class="k">Everyone else</div><div class="v">${rest.toFixed(1)}%</div></div>`);
      if (st.status === "called") boxes.push(`<div class="box"><div class="k">AP call</div><div class="v" style="color:var(--gold)">${esc(st.cand.last)} wins</div></div>`);
    } else {
      boxes.push(`<div class="vs">VS</div>`);
      if (p) boxes.push(`<div class="box"><div class="k">Latest poll</div><div class="v">${[a, b].filter(Boolean).map((c) => `${esc(c.last)} <b>${pollNumber(p, c) ?? "–"}</b>`).join(" · ")}</div><div class="m">${esc(p.pollster)}${p.sponsored ? " (campaign-sponsored)" : p.partisan ? ` (${esc(p.partisan)})` : ""} · ${esc(p.dates)}${p.sample ? ` · n=${p.sample}` : ""}</div></div>`);
      if (prior) boxes.push(`<div class="box"><div class="k">Last time</div><div class="v">${prior.candidates.slice(0, 2).map((c) => `<span style="color:${PARTY_COLOR[partyKey(c)]}">${esc(c.last)}</span> ${c.pct}%`).join(" · ")}</div><div class="m">${esc(String(prior.date).slice(0, 4))}${prior.note ? " · " + esc(prior.note) : ""}</div></div>`);
      const holder = race.currentParty ? `${race.currentParty === "Dem" ? "Democratic" : race.currentParty === "GOP" ? "Republican" : race.currentParty}-held` : "Open seat";
      boxes.push(`<div class="box"><div class="k">Seat</div><div class="v">${esc(holder)}${race.rankedChoice ? `</div><div class="m">Ranked-choice voting` : ""}</div></div>`);
    }
    $("mid").innerHTML = boxes.join("");
    $("updated").textContent = `Updated ${new Date(race.lastUpdated).toLocaleTimeString("en-US")}`;
  }
  connectFeed({
    onSnapshot: async (s) => { race = s.races.get(raceId); await loadStatic(); render(); },
    onUpdate: (s, msg) => { if (msg.changed.some((r) => r.id === raceId)) { race = s.races.get(raceId); render(); } },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
