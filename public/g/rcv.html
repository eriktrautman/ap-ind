<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ranked-Choice Rounds</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B9: round-by-round table for a ranked-choice race. ?id=<raceID> required.
     AP's results feed carries first-choice totals on election night; round-by-round tabulation
     is published by the state days later. Rounds render when the poller has them (race.rounds). */
  .body { display: grid; grid-template-rows: 1fr auto; gap: 20px; min-height: 0; }
  td.nm { font-weight: 600; } td.el { color: var(--muted); font-style: italic; }
  td.lead { font-weight: 700; color: var(--gold); }
  .winrow td { background: rgba(250, 204, 21, .08); }
  .pill { display: inline-block; font-size: 22px; padding: 2px 12px; border-radius: 4px; background: #2a3a5c; color: var(--fg); margin-left: 16px; vertical-align: middle; }
  .explain { font-size: 26px; color: var(--muted); line-height: 1.35; }
  .explain b { color: var(--fg); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Ranked choice</div><div class="title" id="title">Loading…</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body">
    <div><table id="tbl"><thead id="thead"></thead><tbody id="rows"></tbody></table></div>
    <div class="explain" id="explain"></div>
  </div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: AP via lightship.media · a candidate needs more than 50% to win; the last-placed candidate is eliminated and their ballots transfer</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, partyClass, fmt, officeText, clockS } from "./feed.js";
  const q = new URLSearchParams(location.search);
  const raceId = q.get("id"), bg = q.get("bg");
  if (bg) document.body.classList.add(`bg-${bg}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const tag = (c) => `<span class="tag ${c.featured || c.independent ? "ind" : partyClass(c.party)}">${c.featured || c.independent ? "I" : c.party === "Dem" ? "D" : c.party === "GOP" ? "R" : esc(c.party)}</span>`;
  let race = null;

  function render() {
    if (!race) { $("title").textContent = "Race not found"; return; }
    $("title").innerHTML = `${esc(race.stateName)} <small>${esc(officeText(race))}</small>${race.called ? '<span class="call">AP CALL</span>' : ""}${race.rankedChoice ? "" : '<span class="pill">not a ranked-choice race</span>'}`;
    $("reporting").innerHTML = race.totalVotes ? `<b>${Math.round(race.eevp || race.precinctsPct)}%</b> of expected vote in` : "No results yet";
    $("updated").textContent = `Updated ${clockS(race.lastUpdated)}`;
    const cands = [...race.candidates].sort((a, b) => b.votes - a.votes);
    const rounds = Array.isArray(race.rounds) && race.rounds.length ? race.rounds : null;
    if (!rounds) {
      // First-choice totals only
      $("thead").innerHTML = `<tr><th>Candidate</th><th class="r">First choices</th><th class="r">Share</th></tr>`;
      $("rows").innerHTML = cands.map((c) => `<tr class="${c.winner ? "winrow" : ""}"><td class="nm">${tag(c)}${esc(c.name)}${c.winner ? " ✓" : ""}</td><td class="r">${fmt(c.votes)}</td><td class="r ${c === cands[0] ? "lead" : ""}">${Number(c.pct).toFixed(1)}%</td></tr>`).join("");
      const top = cands[0];
      $("explain").innerHTML = top && race.totalVotes
        ? (top.pct > 50 ? `<b>${esc(top.last)}</b> is above 50% of first choices, so no further rounds would be needed.` : `No candidate is above 50% of first choices. <b>${esc(cands[cands.length - 1].last)}</b> would be eliminated first and those ballots move to their next choice. Round-by-round results are published by the state after election night and appear here when AP carries them.`)
        : "Round-by-round results appear here when AP carries them.";
      return;
    }
    // rounds: [{round: 1, candidates: [{id, votes, pct, eliminated}]}]
    $("thead").innerHTML = `<tr><th>Candidate</th>${rounds.map((r, i) => `<th class="r">${i === rounds.length - 1 && rounds.length > 1 ? "Final" : `Round ${r.round ?? i + 1}`}</th>`).join("")}</tr>`;
    $("rows").innerHTML = cands.map((c) => `<tr class="${c.winner ? "winrow" : ""}"><td class="nm">${tag(c)}${esc(c.name)}${c.winner ? " ✓" : ""}</td>${rounds.map((r) => {
      const x = r.candidates.find((k) => k.id === c.id);
      if (!x) return `<td class="r el">—</td>`;
      if (x.eliminated) return `<td class="r el">elim.</td>`;
      return `<td class="r">${Number(x.pct ?? 0).toFixed(1)}</td>`;
    }).join("")}</tr>`).join("");
    const last = rounds[rounds.length - 1];
    const w = last.candidates.slice().sort((a, b) => (b.pct ?? 0) - (a.pct ?? 0))[0];
    const wc = race.candidates.find((c) => c.id === w?.id);
    $("explain").innerHTML = wc ? `<b>${esc(wc.name)}</b> finishes at ${Number(w.pct).toFixed(1)}% after ${rounds.length} ${rounds.length === 1 ? "round" : "rounds"}.` : "";
  }
  connectFeed({
    onSnapshot: (s) => { race = s.races.get(raceId); render(); },
    onUpdate: (s, msg) => { if (msg.changed.some((r) => r.id === raceId)) { race = s.races.get(raceId); render(); } },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
