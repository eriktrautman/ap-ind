<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candidate Profile</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B1: bio and photo from config/candidates.json with live numbers. ?id=<raceID>; ?cand=<candidateID> (default: the featured independent). */
  .body { display: grid; grid-template-columns: 440px 1fr; gap: 56px; min-height: 0; }
  .photo { width: 440px; height: 540px; border-radius: 8px; background: #1b2a4a center/cover no-repeat; display: flex; align-items: flex-end; justify-content: center; color: var(--muted); font-size: 24px; }
  .photo.none::after { content: "no verified photo"; padding-bottom: 20px; }
  .facts { display: grid; grid-template-columns: 180px 1fr; gap: 10px 20px; font-size: 28px; align-content: start; }
  .facts .k { color: var(--muted); font-size: 22px; text-transform: uppercase; letter-spacing: .06em; padding-top: 6px; }
  .facts .v { line-height: 1.3; }
  .now { margin-top: 26px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 18px 24px; display: flex; gap: 40px; align-items: baseline; }
  .now b { font-size: 56px; } .now .m { color: var(--muted); font-size: 24px; }
  .pill { display: inline-block; font-size: 22px; font-weight: 700; padding: 3px 12px; border-radius: 4px; letter-spacing: .04em; vertical-align: middle; }
  .pill.call { background: var(--gold); color: #1a1600; } .pill.counting { background: #2a3a5c; color: #fff; } .pill.open { background: #16213a; color: var(--muted); border: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker" id="kicker">Candidate</div><div class="title" id="title">Loading…</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body">
    <div><div class="photo none" id="photo"></div><div class="note" id="credit" style="margin-top:8px"></div></div>
    <div><div class="facts" id="facts"></div><div class="now" id="now"></div></div>
  </div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: campaign and public records (config/candidates.json) · numbers from AP</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, partyKey, PARTY_COLOR, officeText, raceState, isFeaturedCand, fmt, clockS } from "./feed.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const raceId = q.get("id"), candId = q.get("cand");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let race = null, bios = null;
  async function loadBios() { try { bios = new Map((await (await fetch("./candidates.json")).json()).candidates.map((c) => [c.id, c])); } catch { bios = new Map(); } }
  function render() {
    if (!race) { $("title").textContent = "Race not found"; return; }
    const cands = [...race.candidates].sort((a, b) => b.votes - a.votes);
    const c = (candId && race.candidates.find((x) => x.id === candId)) ?? race.candidates.find((x) => x.featured) ?? race.candidates.find((x) => isFeaturedCand(x.id)) ?? cands[0];
    const bio = bios?.get(c.id) ?? {};
    const st = raceState(race);
    $("kicker").textContent = `${race.label} · ${race.stateName} · ${officeText(race)}`;
    $("title").innerHTML = `${esc(c.name)} <small style="color:${PARTY_COLOR[partyKey(c)]}">${esc(bio.partyLabel ?? (partyKey(c) === "ind" ? "Independent" : c.party === "Dem" ? "Democrat" : c.party === "GOP" ? "Republican" : c.party))}</small>`;
    $("reporting").innerHTML = race.totalVotes ? `<b>${Math.round(race.eevp || race.precinctsPct)}%</b> of expected vote in` : "No results yet";
    const photo = $("photo");
    if (c.photo) { photo.style.backgroundImage = `url("${c.photo}")`; photo.classList.remove("none"); } else photo.classList.add("none");
    $("credit").textContent = bio.photo && typeof bio.photo === "object" && bio.photo.credit ? `Photo: ${bio.photo.credit}${bio.photo.license ? " · " + bio.photo.license : ""}` : "";
    const rows = [["Born", bio.born], ["Lives in", bio.residence], ["Occupation", bio.occupation], ["Prior office", bio.priorOffices], ["Military", bio.military], ["Education", bio.education], ["Incumbent", c.incumbent ? "Yes" : bio.incumbent === "True" ? "Yes" : null]].filter(([, v]) => v);
    $("facts").innerHTML = rows.map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(String(v).slice(0, 160))}</div>`).join("") + (bio.notes ? `<div class="k">Notes</div><div class="v">${esc(String(bio.notes).slice(0, 220))}</div>` : "");
    const rival = cands.find((x) => x.id !== c.id);
    const pill = st.status === "called" ? `<span class="pill call">AP CALL${st.cand.id === c.id ? " · WINS" : ""}</span>` : st.status === "leading" ? `<span class="pill counting">${Math.round(race.eevp || race.precinctsPct)}% IN</span>` : st.status === "closed" ? `<span class="pill open">POLLS CLOSED</span>` : `<span class="pill open">POLLS OPEN</span>`;
    $("now").innerHTML = race.totalVotes
      ? `<span><b style="color:${PARTY_COLOR[partyKey(c)]}">${Number(c.pct).toFixed(1)}%</b> <span class="m">${fmt(c.votes)} votes</span></span>${rival ? `<span class="m">${esc(rival.last)} ${Number(rival.pct).toFixed(1)}%</span>` : ""}${pill}`
      : `<span class="m">Tonight: no results yet</span>${pill}`;
    $("updated").textContent = `Updated ${clockS(race.lastUpdated)}`;
  }
  connectFeed({
    onSnapshot: async (s) => { race = s.races.get(raceId); await loadBios(); render(); },
    onUpdate: (s, msg) => { if (msg.changed.some((r) => r.id === raceId)) { race = s.races.get(raceId); render(); } },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
