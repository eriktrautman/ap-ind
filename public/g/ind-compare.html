<!doctype html>
<html lang="en">
<head>
<script src="/g/theme-boot.js"></script>
<meta charset="utf-8">
<title>Independent Comparison</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* B17: one race's independent vote this cycle against its last result on file (config/baseline-federal.json). Independent is anyone
     who isn't a Democrat or Republican, as in C10; their bar stacks candidate by candidate, so its total reads against each party's bar. */
  .panel { grid-template-rows: auto 1fr auto; }
  .body { display: flex; flex-direction: column; justify-content: space-evenly; gap: 14px; min-height: 0; overflow: hidden; }
  .headline { font-size: 46px; font-weight: 700; line-height: 1.15; }
  .headline b { color: var(--ind-text, var(--ind)); } .headline small { font-size: 30px; font-weight: 400; color: var(--muted); margin-left: 14px; }
  .cycle h3 { margin: 0 0 12px; font-size: 34px; font-weight: 700; border-bottom: 2px solid var(--rule); padding-bottom: 8px; }
  .cycle h3 small { font-size: 24px; font-weight: 400; color: var(--muted); margin-left: 14px; }
  .row { display: grid; grid-template-columns: 250px 1fr 300px; align-items: center; gap: 18px; margin-bottom: 10px; }
  .who { font-size: 30px; font-weight: 700; }
  .track { display: flex; gap: 3px; height: 52px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
  html[data-theme="democracy-dashboard"] .track { background: rgba(0,0,0,.06); }
  .seg { display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 28px; font-weight: 700; color: #fff; }
  .seg.ind { color: var(--ind-fg, #fff); } .seg.ind.minor { color: #1a1600; }
  .seg.dem { background: var(--dem); } .seg.gop { background: var(--gop); }
  .none { align-self: center; padding: 0 14px; color: var(--muted); font-size: 26px; font-style: italic; }
  .tot { text-align: right; white-space: nowrap; } .tot b { font-size: 44px; } .tot span { display: inline-block; min-width: 150px; font-size: 26px; color: var(--muted); margin-left: 8px; }
  .names { margin: -2px 318px 10px 268px; font-size: 25px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .names i { display: inline-block; width: 18px; height: 18px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .names > span { margin-right: 24px; }
  /* Three lanes in each cycle: tighter, so the two cycles still fit the panel. */
  .tight .row { margin-bottom: 6px; } .tight .track { height: 42px; } .tight .seg { font-size: 26px; } .tight .who { font-size: 28px; } .tight .tot b { font-size: 38px; }
  .tight .cycle h3 { margin-bottom: 8px; padding-bottom: 4px; font-size: 30px; } .tight .names { margin-bottom: 6px; font-size: 23px; } .tight .headline { font-size: 40px; }
  .tot .dash { color: var(--muted); font-size: 38px; }
  .empty { color: var(--muted); font-size: 34px; text-align: center; margin: auto; }
  .note { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">Independent comparison</div><div class="title" id="title">Loading…</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body" id="body"></div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: AP via lightship.media · <span class="note">Ind = not Dem or Rep</span></span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, isMeasure, isFeaturedCand, officeText, fmt, clockS, incStar } from "./feed.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const raceId = q.get("id");
  const LANES = [["ind", "Independents"], ["gop", "Republican"], ["dem", "Democrat"]];
  const laneOf = (c) => (c.party === "GOP" && !isFeaturedCand(c.id) ? "gop" : c.party === "Dem" && !isFeaturedCand(c.id) ? "dem" : "ind");
  // The biggest independent in the full colour, each one after it paler, so the stack reads as one bar made of people.
  const indColor = (i) => (i === 0 ? "var(--ind)" : `color-mix(in srgb, var(--ind) ${Math.max(25, 62 - (i - 1) * 16)}%, #fff)`);
  let race = null, prior = null, priorLoaded = false;

  /** One cycle as lanes: {ind: {votes, pct, cands: [{...c, share}]}, ...}, shares of every vote in the race. */
  function lanes(cands, total) {
    const out = Object.fromEntries(LANES.map(([k]) => [k, { votes: 0, pct: 0, cands: [] }]));
    for (const c of [...cands].sort((a, b) => b.votes - a.votes)) {
      const l = out[laneOf(c)], share = total ? c.votes / total * 100 : 0;
      l.votes += c.votes; l.pct += share; l.cands.push({ ...c, share });
    }
    return out;
  }
  function rowHtml(key, label, lane, top) {
    const multi = lane.cands.length > 1;
    const segs = lane.cands.filter((c) => c.share > 0).map((c, i) => `<div class="seg ${key} ${key === "ind" && i ? "minor" : ""}" style="flex:0 0 ${c.share / top * 100}%${key === "ind" ? `;background:${indColor(i)}` : ""}">${c.share / top >= .08 ? `${esc(c.last)}${incStar(c)}` : ""}</div>`).join("");
    const names = key === "ind" && multi ? `<div class="names">${lane.cands.map((c, i) => `<span><i style="background:${indColor(i)}"></i>${esc(c.last)}${incStar(c)} ${c.share.toFixed(1)}%</span>`).join("")}</div>` : "";
    return `<div class="row"><div class="who">${label}</div><div class="track">${segs || `<div class="none">No ${key === "ind" ? "independent" : label} on the ballot</div>`}</div><div class="tot">${lane.cands.length ? `<b>${lane.pct.toFixed(1)}%</b>` : `<b class="dash">—</b>`}<span>${lane.votes ? fmt(lane.votes) : ""}</span></div></div>${names}`;
  }
  const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function render() {
    if (!race) { $("title").textContent = "Race not found"; return; }
    $("title").innerHTML = `${esc(race.stateName)} <small>${esc(officeText(race))}</small>${race.called ? '<span class="call">AP CALL</span>' : ""}`;
    const inPct = Math.round(race.eevp || race.precinctsPct || 0), counting = !race.totalVotes || inPct < 100;
    $("reporting").innerHTML = race.totalVotes ? (counting ? `*2026: <b>${inPct}%</b> of expected vote in` : "") : "No results yet";
    $("updated").textContent = `Updated ${clockS(race.lastUpdated)}`;
    if (isMeasure(race)) { $("body").innerHTML = `<div class="empty">A ballot measure has no candidates to compare.</div>`; return; }
    if (!priorLoaded) return;
    if (!prior) { $("body").innerHTML = `<div class="empty">No last-cycle result on file for this race.</div>`; return; }
    const now = lanes(race.candidates, race.totalVotes), then = lanes(prior.candidates, prior.total);
    const year = prior.date.slice(0, 4), shown = LANES.filter(([k]) => now[k].cands.length || then[k].cands.length);
    const top = Math.max(60, ...shown.flatMap(([k]) => [now[k].pct, then[k].pct]));
    const diff = Number(now.ind.pct.toFixed(1)) - Number(then.ind.pct.toFixed(1));   // from the figures on screen, so the subtraction checks out on air
    const was = then.ind.cands.length ? `${then.ind.pct.toFixed(1)}% in ${year}` : "";
    const headline = race.totalVotes
      ? `Independents <b>${now.ind.pct.toFixed(1)}%</b><small>${!was ? `none on the ballot in ${year}` : `${Math.abs(diff) < .05 ? "level with" : `${diff > 0 ? "up" : "down"} ${Math.abs(diff).toFixed(1)} points from`} ${was}`}</small>`
      : (was ? `Independents had <b>${then.ind.pct.toFixed(1)}%</b> here in ${year}<small>no votes counted yet in 2026</small>` : `No independent on the ballot here in ${year}<small>no votes counted yet in 2026</small>`);
    const cycle = (label, sub, l) => `<div class="cycle"><h3>${label}${sub ? `<small>${esc(sub)}</small>` : ""}</h3>${shown.map(([k, name]) => rowHtml(k, name, l[k], top)).join("")}</div>`;
    $("body").classList.toggle("tight", shown.length > 2);
    $("body").innerHTML = `<div class="headline">${headline}</div>${cycle(year, prior.note ? capital(prior.note) : "", then)}${cycle(`2026${counting ? "*" : ""}`, "", now)}`;
  }
  async function loadPrior() {
    try { prior = (await (await fetch("./baseline-federal.json")).json()).races?.[raceId] ?? null; } catch { prior = null; }
    priorLoaded = true; render();
  }
  connectFeed({
    onSnapshot: (s) => { race = s.races.get(raceId) ?? null; render(); },
    onUpdate: (s) => { race = s.races.get(raceId) ?? race; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
  loadPrior();
</script>
</body>
</html>
