<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Featured Races Board</title>
<link rel="stylesheet" href="./g.css">
<style>
  /* C1: every featured race in one table. Featured races come from the producer state (?src=). */
  .body { min-height: 0; overflow: hidden; }
  table { font-size: 34px; }
  th { font-size: 24px; } td { padding: 14px 10px; }
  td.lab { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  td.who { color: #fde68a; font-weight: 600; }
  td.who .vs { color: var(--muted); font-weight: 400; font-size: 26px; margin-left: 12px; }
  .pill { display: inline-block; font-size: 22px; font-weight: 700; padding: 4px 14px; border-radius: 4px; letter-spacing: .04em; }
  .pill.call { background: var(--gold); color: #1a1600; } .pill.counting { background: #2a3a5c; color: #fff; } .pill.open { background: #16213a; color: var(--muted); border: 1px solid var(--rule); }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><div><div class="kicker">The independent movement</div><div class="title">Featured races tonight</div></div><div class="reporting" id="reporting"></div></div>
  <div class="body"><table><thead><tr><th>Race</th><th>Independent</th><th class="r">Share</th><th class="r">Margin</th><th class="r">In</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="foot"><span><span class="dot" id="dot"></span>Source: AP via lightship.media · margin is the independent's share minus the leader's (or the runner-up's when leading)</span><span id="updated"></span></div>
</div>
<script type="module">
  import { connectFeed, freshness, raceState, clockS } from "./feed.js";
  import { watchState, FEATURED_RACES } from "./control.js";
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.classList.add(`bg-${q.get("bg")}`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let races = null, ids = FEATURED_RACES.map((r) => r.id);

  function render() {
    if (!races) return;
    const list = ids.map((id) => races.get(id)).filter(Boolean);
    $("reporting").innerHTML = `<b>${list.length}</b> races · <b>${list.filter((r) => r.called).length}</b> called`;
    $("rows").innerHTML = list.map((r) => {
      const st = raceState(r);
      const cands = [...r.candidates].sort((a, b) => b.votes - a.votes);
      const ind = r.candidates.find((c) => c.featured) ?? r.candidates.find((c) => c.independent) ?? cands[0];
      const other = cands.find((c) => c.id !== ind.id);
      const margin = r.totalVotes ? (ind.pct ?? 0) - (other?.pct ?? 0) : null;
      const pill = st.status === "called" ? `<span class="pill call">AP CALL${st.cand?.id === ind.id ? " ✓" : ""}</span>` : st.status === "leading" ? `<span class="pill counting">${Math.round(r.eevp || r.precinctsPct)}% IN</span>` : st.status === "closed" ? `<span class="pill open">POLLS CLOSED</span>` : `<span class="pill open">POLLS OPEN</span>`;
      return `<tr><td class="lab">${esc(r.label)}</td><td class="who">${esc(ind.last)}${ind.winner ? " ✓" : ""}<span class="vs">v ${esc(other?.last ?? "")}${other?.winner ? " ✓" : ""}</span></td><td class="r b">${r.totalVotes ? Number(ind.pct).toFixed(1) : "—"}</td><td class="r b ${margin === null ? "" : margin >= 0 ? "pos" : "neg"}">${margin === null ? "—" : (margin >= 0 ? "+" : "") + margin.toFixed(1)}</td><td class="r m">${r.totalVotes ? Math.round(r.eevp || r.precinctsPct) + "%" : "—"}</td><td>${pill}</td></tr>`;
    }).join("") || `<tr><td colspan="6" class="m">No featured races in the feed.</td></tr>`;
    $("updated").textContent = `Updated ${clockS()}`;
  }
  watchState({ onState: (s) => { ids = s.featuredRaceIds.length ? s.featuredRaceIds : FEATURED_RACES.map((r) => r.id); render(); } });
  connectFeed({
    onSnapshot: (s) => { races = s.races; render(); },
    onUpdate: (s) => { races = s.races; render(); },
    onStatus: (s) => { $("dot").className = `dot ${freshness(s.status)}`; },
  });
</script>
</body>
</html>
